name: Release Workflow
on:
  push:
    tags:
      - "v*"
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform-name: windows
            arch: x64
          - os: macos-latest
            platform-name: macos
            arch: arm64
          - os: ubuntu-latest
            platform-name: linux
            arch: x64
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev
      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "21.1.8"
      - name: Build Project
        uses: threeal/cmake-action@v2
        with:
          generator: Ninja
          c-compiler: clang
          cxx-compiler: clang++
      - name: Install Distributables
        run: cmake --install build --prefix dist --component core
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bromine-sim-${{ matrix.os }}-${{ matrix.arch }}
          path: dist

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
      - name: List files for debugging
        run: ls -la
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: bromine-sim-*/**
          tag_name: ${{ github.ref_name }}
          body: "Automated core release of ${{ github.ref_name }} for the bromine-sim extension."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
