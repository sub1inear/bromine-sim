name: Release Workflow
on:
  push:
    tags:
      - "v*"
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform-name: windows
            arch: x64
          - os: macos-latest
            platform-name: macos
            arch: arm64
          - os: ubuntu-latest
            platform-name: linux
            arch: x64
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.14.0"
      - name: Build Project
        uses: threeal/cmake-action@v2
        with:
          generator: Ninja
          c-compiler: "zig;cc"
          cxx-compiler: "zig;c++"
      - name: Install Distributables
        run: cmake --install build --prefix dist --component core
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bromine-sim-${{ matrix.platform-name }}-${{ matrix.arch }}
          path: dist

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
      - name: Archive Artifacts
        run: |
          zip -r bromine-sim-windows-x64.zip bromine-sim-windows-x64
          tar -czf bromine-sim-macos-arm64.tar.gz bromine-sim-macos-arm64
          tar -czf bromine-sim-linux-x64.tar.gz bromine-sim-linux-x64
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bromine-sim-*.zip
            bromine-sim-*.tar.gz
          tag_name: ${{ github.ref_name }}
          body: "Automated core release of ${{ github.ref_name }} for the bromine-sim extension."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
